    <line x1="250" y1="560" x2="300" y2="300"/><line x1="340" y1="560" x2="305" y2="300"/>
    <line x1="263" y1="490" x2="327" y2="490"/><line x1="275" y1="420" x2="318" y2="420"/><line x1="288" y1="355" x2="312" y2="355"/>
  </g>
