    <line x1="800" y1="120" x2="640" y2="160"/><line x1="800" y1="240" x2="640" y2="220"/><line x1="800" y1="360" x2="640" y2="280"/><line x1="800" y1="480" x2="640" y2="340"/>
  </g>
