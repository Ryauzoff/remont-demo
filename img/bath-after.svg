    <line x1="400" y1="600" x2="400" y2="400"/><line x1="533" y1="600" x2="480" y2="400"/><line x1="666" y1="600" x2="560" y2="400"/>
    <line x1="128" y1="440" x2="672" y2="440"/><line x1="80" y1="500" x2="720" y2="500"/><line x1="20" y1="575" x2="780" y2="575"/>
